name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The QML needs Omarchy's shell to run, so CI only covers the pure
      # helpers in plugin/PolkitModel.js. `just test` also validates the
      # manifest with Omarchy's own `omarchy plugin validate`.
      - name: Tests
        run: node --test tests/*.test.js

      # For reviewers: what this plugin changes in Omarchy's agent.
      - name: Changes against Omarchy's agent
        run: |
          {
            echo '### Changes against `upstream/` (the Omarchy agent this is based on)'
            echo '```diff'
            diff -u upstream/PolkitModel.js plugin/PolkitModel.js || true
            diff -u upstream/PolkitAgent.qml plugin/PolkitAgent.qml || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
