name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The QML needs Omarchy's shell to run, so CI only covers the pure
      # helpers in plugin/PolkitModel.js. `just test` also validates the
      # manifest with Omarchy's own `omarchy plugin validate`.
      - name: Tests
        run: node --test tests/
